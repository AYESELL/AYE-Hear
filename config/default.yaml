app:
  name: AYE Hear
  environment: development
  autosave_interval_seconds: 30

audio:
  sample_rate_hz: 16000
  channels: 1
  frame_size: 512
  use_windows_default_input: true

speaker_identification:
  enrollment_seconds: 8
  high_confidence_threshold: 0.85
  medium_confidence_threshold: 0.65

protocol:
  update_interval_seconds: 45
  minimum_confidence: 0.65
  language: de
  supported_languages:
    - de
    - en
  meeting_modes:
    - internal
    - external

models:
  whisper_profile: balanced
  whisper_model: TheChola/whisper-large-v3-turbo-german-faster-whisper
  whisper_model_by_language:
    de: TheChola/whisper-large-v3-turbo-german-faster-whisper
  ollama_model: mistral:7b

# Privacy / Retention controls (ADR-0015, HEAR-142, HEAR-156)
# Production defaults must remain privacy-safe. Benchmark-specific overrides must be
# applied explicitly in non-production runs and must not become repository defaults.
privacy:
  wav_persistence_enabled: true         # HEAR-166 candidate: enable WAV persistence for release validation
  wav_retention_days: 7                 # 1-30; clamped by WavPersistenceConfig
  wav_delete_on_meeting_end: false      # When true: deletes WAV segments immediately on meeting stop
  wav_output_dir: runtime/wav           # Relative to install root; never inside exports/
  review_retention_days: 7              # 1-30; applied to runtime/reviews/*.json cleanup
  trace_retention_days: 7               # 1-30; applied to runtime/traces/*.json cleanup

